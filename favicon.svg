<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="marvelRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e62429" />
      <stop offset="100%" stop-color="#b81d22" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Shadow & Rounded Red Badge Background -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#marvelRed)" filter="url(#badgeShadow)" />
  
  <!-- Subtle Highlight Outline -->
  <rect x="3.75" y="3.75" width="56.5" height="56.5" rx="13.25" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- D616 Text: Bold, Condensed, Single Line, Crisp -->
  <text x="32" y="35" text-anchor="middle" dominant-baseline="central"
        font-family="'Impact', 'Bebas Neue', 'Arial Black', -apple-system, sans-serif"
        font-weight="900" font-size="25" fill="#ffffff" letter-spacing="0.5px">D616</text>
</svg>
